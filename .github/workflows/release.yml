# Publishes the crate to crates.io whenever a GitHub release is published.
#
# One-time setup: create an API token at https://crates.io/settings/tokens (scope: publish-new and
# publish-update) and store it in this repository as the secret CARGO_REGISTRY_TOKEN
# (Settings > Secrets and variables > Actions).
#
# To release: bump `version` in Cargo.toml, commit, then publish a GitHub release whose tag is that version
# with a leading v (for example v0.2.0).
name: Publish to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # Pre-releases are not pushed to crates.io.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly what the release points at.
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release tag is '$TAG' but Cargo.toml says version $version. Bump the version, or tag the release v$version."
            exit 1
          fi

      - name: Layering lints
        run: cargo clippy --locked

      - name: Test
        run: cargo test --locked

      - name: Check the package
        run: cargo publish --dry-run --locked

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
